# Nginx reverse proxy config for za.shone.xin
# Copy to: C:\nginx\conf\nginx.conf after installing Nginx

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # Map for conditional WebSocket upgrade headers


    # HTTP -> HTTPS redirect + ACME challenge
    server {
        listen 80;
        server_name za.shone.xin;

        # ACME challenge for cert renewal (win-acme webroot)
        location /.well-known/acme-challenge/ {
            root C:/nginx/www;
        }
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # HTTPS reverse proxy
    server {
        listen 443 ssl;
        server_name za.shone.xin;

        ssl_certificate     C:/nginx/ssl/za.shone.xin-chain.pem;
        ssl_certificate_key C:/nginx/ssl/za.shone.xin-key.pem;

        # H5 miniapp at /h5/
        location /h5/ {
            proxy_pass http://127.0.0.1:8000/h5/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Nuxt server (root catch-all)
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
