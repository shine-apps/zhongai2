# Nginx reverse proxy config for za.shone.xin (host Windows machine)
# Copy to: C:\nginx\conf\nginx.conf after installing Nginx
# Nitro handles all routing (API, Admin, H5) — nginx only does TLS termination.

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # Map for conditional WebSocket upgrade headers
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # HTTP -> HTTPS redirect + ACME challenge
    server {
        listen 80;
        server_name za.shone.xin;

        # ACME challenge for cert renewal (win-acme webroot)
        location /.well-known/acme-challenge/ {
            root C:/nginx/www;
        }
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # HTTPS reverse proxy
    server {
        listen 443 ssl;
        server_name za.shone.xin;

        ssl_certificate     C:/nginx/ssl/za.shone.xin-chain.pem;
        ssl_certificate_key C:/nginx/ssl/za.shone.xin-key.pem;

        # Nitro handles all routing (API, Admin UI, H5 SPA)
        location / {
            proxy_pass http://127.0.0.1:5200;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
